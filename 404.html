<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена — FeRoseBeauty</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#d4a0a0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #faf6f1;
            color: #2c2424;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 560px;
        }

        .logo-f {
            width: 96px;
            height: 96px;
            margin: 0 auto 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #d4a0a0, #b87878);
            border: 3px solid #e8d5a8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 52px;
            font-weight: 700;
            color: #ffffff;
        }

        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 72px;
            color: #b87878;
            line-height: 1;
            margin-bottom: 16px;
        }

        h2 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        p {
            color: #4a3f3f;
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: 36px;
        }

        .btn {
            display: inline-block;
            padding: 16px 40px;
            background: linear-gradient(135deg, #d4a0a0, #b87878);
            color: #ffffff;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(184, 120, 120, 0.35);
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="logo-f">F</div>
        <h1>404</h1>
        <h2>Такой страницы нет</h2>
        <p>Возможно, адрес указан с ошибкой или страница была перемещена.<br>Приглашаем на главную страницу салона красоты FeRoseBeauty.</p>
        <a class="btn" href="/FeroseBeauty/">На главную</a>
    </main>
</body>
</html>
